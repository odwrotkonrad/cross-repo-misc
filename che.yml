# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
#[why] misc owns the layout, consumers only name this profile: sources resolve against misc's own
#   checkout, so what lands where is declared once here instead of restated in every repo
#[what] the shared CI payload every workspace repo renders: the render script and its make targets
bootstrapCrossRepoCI:
  include:
    renderTemplates:
      - source: shared/ci/make/render.mk
        dest: ${invokingSpecGitRoot}/shared/ci/make/render.mk
        options:
          skipAutoGeneratedHeader: true
      - source: shared/ci/render-templates.zsh
        dest: ${invokingSpecGitRoot}/shared/ci/render-templates.zsh
        chmod: "0755"
        options:
          skipAutoGeneratedHeader: true

#[what] the tagging scripts, for repos that mint their own semver tags
bootstrapCrossRepoCITagging:
  include:
    profiles:
      - bootstrapCrossRepoAssets
    renderTemplates:
      - source: shared/ci/semver-bump.zsh
        dest: ${invokingSpecGitRoot}/shared/ci/semver-bump.zsh
        chmod: "0755"
        options:
          skipAutoGeneratedHeader: true
      - source: shared/ci/tag-mint.zsh
        dest: ${invokingSpecGitRoot}/shared/ci/tag-mint.zsh
        chmod: "0755"
        options:
          skipAutoGeneratedHeader: true

#[what] the shared CI assets every repo runs: the emit-events script and the Ruby behind it
bootstrapCrossRepoAssets:
  include:
    profiles:
      - bootstrapCrossRepoCI
    renderTemplates:
      - source: shared/ci/emit-events.zsh
        dest: ${invokingSpecGitRoot}/shared/ci/emit-events.zsh
        chmod: "0755"
        options:
          skipAutoGeneratedHeader: true
      - source: shared/ci/ruby
        dest: ${invokingSpecGitRoot}/shared/ci/ruby
        options:
          skipAutoGeneratedHeader: true
        <<<:
          - source: /artifact.rb
          - source: /declaration.rb
          - source: /event.rb
          - source: /gitlab.rb
          - source: /emit_events.rb

ontoRepo:
  options:
    autoDiscover: true
  include:
    renderTemplates:
      - source: "git::gitlab.com/konradodwrot/cross-repo/prose/spec@${{ env.PROSE_SPEC_REF }}"
        options:
          skipAutoGeneratedHeader: true
        <<<:
          - source: //conventions/conventions.md
            dest: assets/data/conventions.md
      - source: "git::gitlab.com/konradodwrot/cross-repo/prose/assets@${{ env.PROSE_ASSETS_REF }}"
        options:
          skipAutoGeneratedHeader: true
        <<<:
          - source: //repos/cross-repo/misc/purpose.md
            dest: assets/docs-agents/purpose.md
          - source: //shared/license/LICENSE
            dest: LICENSE
          - source: //templates/2-data
            options:
              skipAutoGeneratedHeader: false
            dest: assets/data
            <<<:
              - source: /makefile-agents.md.ontoRepo.tpl
                dest: makefile.agents.md
              - source: /repo-structure.md.ontoRepo.tpl
                dest: repo-structure.md
          - source: //repos/cross-repo/misc/templates/3-audience
            options:
              skipAutoGeneratedHeader: false
            <<<:
              - source: /README.md.ontoRepo.tpl
                dest: README.md
              - source: /AGENTS.md.ontoRepo.tpl
                dest:
                  - CLAUDE.md
                  - path: AGENTS.md
                    options:
                      renderReferencedFiles: true

claude-agents:
  options:
    autoDiscover: true
    runIf:
      - builtin:isVirt
  include:
    profiles:
      - source: "git::https://gitlab.com/konradodwrot/ai-harness/ai-tools-configs@${{ env.AI_TOOLS_CONFIGS_REF }}//profiles/claude/che.yml::claude/virt"
        ctx:
          repo: Misc

envSeed:
  include:
    renderTemplates:
      - source: .env.tpl
        dest:
          - path: .env
            options:
              writeType: mergeUpsert
##[<] 🤖🤖
