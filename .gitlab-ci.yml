##[>] 🤖🤖
include:
  - local: shared/ci/templates/EmitEvents.gitlab-ci.yml

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - validate
  - release
  - trigger

default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - unknown_failure
  tags:
    - gke-linux-amd64-small

variables:
  ARTIFACT_REGISTRY: $GRP_KO_VAR_ARTIFACT_REGISTRY
  OCI_IMAGES_CI_LINUX_REF: $GRP_KO_VAR_OCI_IMAGES_CI_LINUX_REF
  CHE_SCHEMA_REF: $GRP_KO_VAR_CHE_SCHEMA_REF
  PROSE_ASSETS_REF: $GRP_KO_VAR_PROSE_ASSETS_REF
  AI_TOOLS_CONFIGS_REF: $GRP_KO_VAR_AI_TOOLS_CONFIGS_REF
  PROSE_SPEC_REF: $GRP_KO_VAR_PROSE_SPEC_REF
  CI_IMAGE: $ARTIFACT_REGISTRY/ci-linux:$OCI_IMAGES_CI_LINUX_REF

validate-pre-commit-all:
  stage: validate
  image: $CI_IMAGE
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
      changes:
        - .gitlab-ci.yml
        - .env.tpl
        - che.yml
        - Makefile
        - lefthook.yml
        - .repo/*.tpl
        - .repo/deps-graph.yml
        - .repo/upstream.yml
        - .repo/upstream.env
        - lib/**/*
        - shared/**/*
        - test/**/*
        - README.md
  script:
    - make repo-ci-precommit-all
    - git diff --exit-code HEAD

test-ruby:
  stage: validate
  image: $CI_IMAGE
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
      changes:
        - lib/**/*
        - shared/**/*
        - test/**/*
        - Makefile
  script:
    - make test

tag-mint:
  stage: release
  image: $CI_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - lib/**/*
        - shared/**/*
        - che.yml
        - Makefile
        - .env.tpl
        - .gitlab-ci.yml
  variables:
    GIT_DEPTH: "0"
    TAG_TOKEN: $REPO_PROTECTED_VAR_BOT_TAG_TOKEN
  script:
    - make tag-mint

emit-events:
  extends: .emit-events
  stage: trigger

