##[>] 🤖🤖
include:
  - local: shared/ci/templates/EmitEvents.gitlab-ci.yml

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - validate
  - release
  - trigger

default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - unknown_failure
  tags:
    - gke-linux-amd64-small

variables:
  ARTIFACT_REGISTRY: $GRP_KO_VAR_ARTIFACT_REGISTRY
  OCI_IMAGES_CI_LINUX_REF: $GRP_KO_VAR_OCI_IMAGES_CI_LINUX_REF
  PROSE_ASSETS_REF: $GRP_KO_VAR_PROSE_ASSETS_REF
  AI_CONFIGS_REF: $GRP_KO_VAR_AI_CONFIGS_REF
  PROSE_SPEC_REF: $GRP_KO_VAR_PROSE_SPEC_REF
  CI_IMAGE: $ARTIFACT_REGISTRY/ci-linux:$OCI_IMAGES_CI_LINUX_REF

validate-pre-commit-all:
  stage: validate
  image: $CI_IMAGE
  rules:
    - changes:
        paths: [.repo/artifacts-produced.yml, .repo/artifacts-consumed.yml]
        compare_to: refs/heads/main
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  script:
    - make repo-ci-precommit-all
    - git diff --exit-code HEAD

test-ruby:
  stage: validate
  image: $CI_IMAGE
  rules:
    - changes:
        paths: [.repo/artifacts-produced.yml, .repo/artifacts-consumed.yml]
        compare_to: refs/heads/main
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  script:
    - make test

tag-mint:
  stage: release
  image: $CI_IMAGE
  rules:
    - changes:
        paths: [.repo/artifacts-produced.yml, .repo/artifacts-consumed.yml]
        compare_to: refs/heads/main
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GIT_DEPTH: "0"
    TAG_TOKEN: $REPO_VAR_TAG_TOKEN
  script:
    - make tag-mint

emit-events:
  extends: .emit-events
  stage: trigger
##[<] 🤖🤖
