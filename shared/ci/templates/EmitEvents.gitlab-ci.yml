##[>] 🤖🤖
#[why] one terminal job per repo, so a commit touching several .repo/ files sends one array and
#   triggers automation exactly once; the script decides what the pipeline owes, the job just sends it.
#   A hidden job, so each repo names its own stage while the body stays here.
.emit-events:
  image: $CI_IMAGE
  interruptible: false
  #[why] a tag pipeline always runs: artifact.released is what announces a completed release, and it
  #   is built from CI_COMMIT_TAG, not from any changed path
  #[why] on a branch the job only owes something when a declaration changed. downstream.yml
  #   is excluded on purpose: the release it records was already announced by artifact.released on
  #   the tag, so re-announcing it here would trigger a pipeline for a commit that changed nothing else
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .repo/*.tpl
        - .repo/deps-graph.yml
        - .repo/upstream.yml
        - .repo/upstream.env
  variables:
    GIT_DEPTH: "2"
    AUTOMATION_PROJECT: konradodwrot/cross-repo/automation
    EMIT_EVENTS_TOKEN: $GRP_KO_PROTECTED_VAR_BOT_EMIT_EVENTS_TOKEN
  #[why] che renders the payload directly rather than through a make target: not every consumer
  #   defines one (iac, go-modules and oci-images do not), and the job only needs this script
  script:
    - '[ -x shared/ci/emit-events.zsh ] || CHE_ENV_UNSET=empty ${CHE_BIN:-che} render-templates --profiles=bootstrapCrossRepoCI'
    - shared/ci/emit-events.zsh
